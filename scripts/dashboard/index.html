<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IoT Live Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Monaco', 'Menlo', monospace;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #58a6ff; font-size: 20px; margin: 0 0 8px 0; }
    .status { font-size: 12px; margin-bottom: 16px; color: #8b949e; }
    .status.connected { color: #3fb950; }
    .status.disconnected { color: #f85149; }
    .controls { margin-bottom: 16px; }
    .controls input {
      background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
      padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 12px;
    }
    .controls button {
      background: #238636; border: none; color: white;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 12px; margin-left: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .device-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
    }
    .device-card.alert { border-color: #f85149; }
    .device-id { color: #58a6ff; font-weight: bold; font-size: 13px; }
    .device-meta { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .metrics { margin-top: 8px; }
    .metric-row {
      display: flex; justify-content: space-between; padding: 4px 0;
      font-size: 12px; border-bottom: 1px solid #21262d;
    }
    .metric-row:last-child { border-bottom: none; }
    .metric-name { color: #8b949e; }
    .metric-value { color: #e6edf3; }
    .alert-badge {
      background: #f85149; color: white; font-size: 10px;
      padding: 2px 6px; border-radius: 4px; margin-left: 6px;
    }
    .event-log {
      margin-top: 20px; max-height: 200px; overflow-y: auto;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 10px; font-size: 11px;
    }
    .event-log-item { padding: 2px 0; }
    .event-log-item.alert { color: #f85149; }
  </style>
</head>
<body>
  <h1>🌡️ IoT Live Dashboard</h1>
  <div class="status" id="status">Connecting...</div>

  <div class="controls">
    <input id="filter" placeholder="Filter by device ID (or leave blank for all)" />
    <button onclick="connect()">Reconnect</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div class="grid" id="devices"></div>
  <div class="event-log" id="log"></div>

  <script>
    const WS_URL = 'ws://localhost:3004/ws';
    let ws;
    const devices = new Map();

    function connect() {
      if (ws) ws.close();
      const status = document.getElementById('status');

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        status.textContent = '● Connected to ' + WS_URL;
        status.className = 'status connected';
      };

      ws.onclose = () => {
        status.textContent = '● Disconnected. Reconnecting...';
        status.className = 'status disconnected';
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        status.textContent = '● Connection error';
        status.className = 'status disconnected';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'welcome') return;
        if (msg.type === 'telemetry') updateTelemetry(msg.data);
        if (msg.type === 'alert') logAlert(msg.data);
      };
    }

    function updateTelemetry(data) {
      const filter = document.getElementById('filter').value.trim();
      if (filter && data.deviceId !== filter) return;

      const existing = devices.get(data.deviceId) || {};
      const merged = {
        ...existing,
        deviceId: data.deviceId,
        tags: data.tags || existing.tags,
        timestamp: data.timestamp,
        metrics: { ...existing.metrics, ...data.metrics },
      };
      devices.set(data.deviceId, merged);
      render();
    }

    function logAlert(alert) {
      const log = document.getElementById('log');
      const item = document.createElement('div');
      item.className = 'event-log-item alert';
      item.textContent = `🚨 [${alert.severity}] ${alert.deviceId} ${alert.message} = ${alert.value}`;
      log.prepend(item);
      while (log.children.length > 50) log.removeChild(log.lastChild);

      const card = devices.get(alert.deviceId);
      if (card) {
        card.hasAlert = true;
        setTimeout(() => { card.hasAlert = false; render(); }, 5000);
      }
    }

    function render() {
      const container = document.getElementById('devices');
      const sorted = Array.from(devices.values()).sort((a, b) =>
        a.deviceId.localeCompare(b.deviceId)
      );

      container.innerHTML = sorted.map(d => `
        <div class="device-card ${d.hasAlert ? 'alert' : ''}">
          <div class="device-id">
            ${d.deviceId}
            ${d.hasAlert ? '<span class="alert-badge">ALERT</span>' : ''}
          </div>
          <div class="device-meta">
            ${d.tags ? Object.entries(d.tags).map(([k,v]) => `${k}=${v}`).join(' · ') : ''}
          </div>
          <div class="metrics">
            ${Object.entries(d.metrics || {}).map(([k, v]) => `
              <div class="metric-row">
                <span class="metric-name">${k}</span>
                <span class="metric-value">${typeof v === 'number' ? v.toFixed(2) : v}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    connect();
  </script>
</body>
</html>
