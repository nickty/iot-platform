global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: iot-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: ingest-http
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics

  - job_name: processor-realtime
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: /metrics

  - job_name: processor-batch
    static_configs:
      - targets: ['host.docker.internal:3005']


  - job_name: archive-consumer
    static_configs:
      - targets: ['host.docker.internal:3006']

  # Add these on Day 6 when services come online:
  # - job_name: api-rest
  #   static_configs:
  #     - targets: ['host.docker.internal:3003']